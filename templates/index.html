<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 750px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input[type="file"],
        textarea {
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            min-height: 180px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        input[type="file"] {
            margin-bottom: 10px;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Resume Analyzer</h1>

    <p class="description">
        Upload your resume and compare it with a job description.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <label for="resume">Upload Resume (PDF)</label>

        <input
            type="file"
            id="resume"
            name="resume"
            accept=".pdf"
            required
        >

        <label for="job_description">Job Description</label>

        <textarea
            id="job_description"
            name="job_description"
            placeholder="Paste the job description here..."
            required
        ></textarea>

        <button type="submit">Analyze Resume</button>

    </form>

</div>

</body>
</html>
